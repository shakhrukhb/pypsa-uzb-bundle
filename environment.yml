# Conda environment for PyPSA Uzbekistan project (Linux / macOS).
#
# Create the env:    conda env create -f environment.yml
# Activate:          conda activate pypsa-uzb
# Recreate (Linux):  conda update --file environment.yml --prune
#
# Python pinned to 3.11 (PyPSA 1.1.2 also works on 3.10/3.12).
# All non-stdlib packages are pulled via pip from requirements.txt
# so the env is identical across OSes.

name: pypsa-uzb
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
